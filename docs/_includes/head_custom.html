<meta name="color-scheme" content="light dark">
<script>
  // The reader's light or dark choice, else the system's: applied before first paint.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('aio-theme'); } catch (e) {}
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) {
      var css = document.querySelector('[rel="stylesheet"]');
      css.setAttribute('href', css.getAttribute('href').replace(/just-the-docs-[a-z]+\.css$/, 'just-the-docs-dark.css'));
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // GitHub alerts (`> [!NOTE]`, `> [!TIP]`, `> [!IMPORTANT]`, `> [!WARNING]`,
    // `> [!CAUTION]`) render natively on github.com; on the site they become callouts.
    var LABELS = { NOTE: 'Note', TIP: 'Tip', IMPORTANT: 'Important', WARNING: 'Warning', CAUTION: 'Caution' };
    document.querySelectorAll('.main-content blockquote').forEach(function (quote) {
      var first = quote.querySelector('p');
      if (!first) return;
      var match = /^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/.exec(first.innerHTML);
      if (!match) return;
      first.innerHTML = first.innerHTML.slice(match[0].length).replace(/^<br\s*\/?>\s*/, '');
      if (first.innerHTML.trim() === '') first.remove();
      var kind = match[1].toLowerCase();
      quote.classList.add('alert', 'alert-' + kind);
      var title = document.createElement('p');
      title.className = 'alert-title';
      title.textContent = LABELS[match[1]];
      quote.insertBefore(title, quote.firstChild);
    });

    // The light/dark switch in the header.
    var toggle = document.getElementById('theme-toggle');
    if (toggle) {
      var sync = function () {
        var dark = jtd.getTheme() === 'dark';
        toggle.setAttribute('aria-pressed', String(dark));
        toggle.setAttribute('title', dark ? 'Switch to the light theme' : 'Switch to the dark theme');
      };
      sync();
      toggle.addEventListener('click', function () {
        var next = jtd.getTheme() === 'dark' ? 'light' : 'dark';
        jtd.setTheme(next);
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('aio-theme', next); } catch (e) {}
        sync();
        // Diagrams are drawn once, in the theme of the moment: redraw them in the new one.
        if (document.querySelector('.language-mermaid')) window.location.reload();
      });
    }
  });
</script>
