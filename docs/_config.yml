# The crypto-aio documentation site, built by GitHub Pages from this directory.
#
# Every page is plain Markdown that also reads well on github.com: links between pages are
# relative `.md` links (jekyll-relative-links turns them into site URLs), diagrams are
# ```mermaid fences, and callouts are GitHub alerts (`> [!NOTE]`), which
# _includes/head_custom.html styles on the site.
#
# Preview locally: see docs/README.md.

title: crypto-aio
description: >-
  One TypeScript API for balances, transfers, confirmations and deposit scanning across EVM
  chains, Bitcoin, Tron, Solana, TON and Avalanche, built for exchanges, wallets and payment
  systems.
url: https://vhidvz.github.io
baseurl: /crypto-aio
lang: en-US

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: light

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Search over every page, down to h3 headings, so "UTXO" or "IDEMPOTENCY_CONFLICT" finds
# the section that explains it.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: true
  focus_shortcut_key: k

mermaid:
  version: "11.4.1"

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
nav_external_links:
  - title: Changelog
    url: https://github.com/vhidvz/crypto-aio/blob/main/CHANGELOG.md
    hide_icon: false
  - title: crypto-aio on npm
    url: https://www.npmjs.com/package/crypto-aio
    hide_icon: false

aux_links:
  GitHub: https://github.com/vhidvz/crypto-aio
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/vhidvz/crypto-aio
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: >-
  crypto-aio is MIT licensed. These pages describe crypto-aio 0.1.0 and the unreleased
  changes on <code>main</code>.

# The design records under superpowers/ are working documents of the 0.1.0 release, kept in
# the repository and linked from explore/design-records.md, not published as pages.
exclude:
  - superpowers/
  - api/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/

defaults:
  - scope:
      path: ""
    values:
      layout: default
