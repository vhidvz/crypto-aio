name: Build, Test, and Publish

# Publishes with npm's trusted publishing (OIDC): no token is stored in the repository. The
# package must name this workflow as its trusted publisher on npmjs.com (package Settings →
# Trusted Publisher → GitHub Actions: user vhidvz, repository crypto-aio, workflow filename
# npm-ci.yml, no environment). Without that, npm falls back to no credentials and the
# registry answers the publish with a 404.
#
# Tag a release with its bare version: `1.0.0` publishes under npm's `latest` dist-tag, and a
# prerelease such as `1.0.0-rc.1` under `next`, so `npm install crypto-aio` never picks it.
# The tag must equal package.json's version, and CHANGELOG.md must have a section for it:
# that section becomes the GitHub Release's notes.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails before anything is published when the tag, package.json and the changelog
      # disagree.
      - name: Check the version and its release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

      # The same checks as CI, then the tarball as a user installs it.
      - name: Check
        run: |
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run lint:package
          pnpm run test:pack

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm to latest (≥11.5.2)
        run: npm install -g npm@11.5.2

      - name: Publish to npm registry
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish --provenance --access public --tag "$dist_tag"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease
