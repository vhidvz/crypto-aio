name: Build, Test, and Publish

# Publishes with npm's trusted publishing (OIDC): no token is stored in the repository. The
# package must name this workflow as its trusted publisher on npmjs.com (package Settings →
# Trusted Publisher → GitHub Actions: user vhidvz, repository crypto-aio, workflow filename
# npm-ci.yml, no environment). Without that, npm falls back to no credentials and the
# registry answers the publish with a 404.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm to latest (≥11.5.2)
        run: npm install -g npm@11.5.2

      - name: Run tests and build project
        run: npm test && npm run build

      - name: Publish to npm registry
        run: npm publish --provenance --access public
